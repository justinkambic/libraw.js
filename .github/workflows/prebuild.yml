name: Build prebuilds

on:
  workflow_dispatch: {}

jobs:
  build-linux:
    name: Build Linux prebuilds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl git autoconf automake libtool pkg-config python3

      - name: Build libjpeg
        run: |
          curl -fsSL http://www.ijg.org/files/jpegsrc.v9d.tar.gz -o jpegsrc.v9d.tar.gz
          tar xzf jpegsrc.v9d.tar.gz
          cd jpeg-9d
          ./configure --with-pic --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd ..

      - name: Build LibRaw
        run: |
          curl -fsSL https://www.libraw.org/data/LibRaw-0.21.2.tar.gz -o LibRaw-0.21.2.tar.gz
          tar xzf LibRaw-0.21.2.tar.gz
          cd LibRaw-0.21.2
          ./configure --with-pic --disable-openmp --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd ..

      - name: Install npm deps
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run prebuildify
        run: npx prebuildify --napi

      - name: Upload Linux prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux
          path: prebuilds

  build-macos:
    name: Build macOS prebuilds
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Homebrew deps
        run: |
          brew update
          brew install jpeg libraw pkg-config python3

      - name: Export Homebrew environment
        run: |
          BREW_PREFIX=$(brew --prefix)
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "PATH=${BREW_PREFIX}/bin:$PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L${BREW_PREFIX}/lib $LDFLAGS" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${BREW_PREFIX}/include $CPPFLAGS" >> $GITHUB_ENV

      - name: Install npm deps
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run prebuildify
        run: npx prebuildify --napi

      - name: Upload macOS prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-macos
          path: prebuilds

  publish-release:
    name: Create draft release with prebuilds
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const out = process.env.GITHUB_OUTPUT;
            if (!out) { console.error('GITHUB_OUTPUT not set'); process.exit(1); }
            fs.appendFileSync(out, 'VERSION=' + pkg.version + '\n');
          "

      - name: Download Linux prebuilds artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilds-linux
          path: artifacts/linux

      - name: Download macOS prebuilds artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilds-macos
          path: artifacts/macos

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Copy raw .node files with platform-arch prefix for easy identification
          # prebuildify produces: prebuilds/<platform>-<arch>/node.napi.node
          # but node-gyp-build expects: prebuilds/<platform>-<arch>/<package-name>.node
          # The upload-artifact preserves the directory structure, so we flatten
          # the .node files into release-assets with descriptive names.

          for dir in artifacts/linux artifacts/macos; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.node" | while read -r node_file; do
                # Extract the platform-arch directory name (e.g., linux-x64, darwin-arm64)
                platform_arch=$(basename "$(dirname "$node_file")")
                fname=$(basename "$node_file")
                asset_name="${platform_arch}-${fname}"
                echo "Copying ${node_file} -> release-assets/${asset_name}"
                cp "$node_file" "release-assets/${asset_name}"
              done
            fi
          done

          echo "Release assets:"
          ls -la release-assets/

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"

          # Create the draft release
          gh release create "$TAG" \
            --draft \
            --title "v${VERSION}" \
            --notes "Automated prebuilds for version ${VERSION}.
          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.workflow }}"

          # Upload all .node files as release assets
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename "$f")"
            gh release upload "$TAG" "$f"
          done

          echo "Draft release ${TAG} created with assets:"
          gh release view "$TAG"
